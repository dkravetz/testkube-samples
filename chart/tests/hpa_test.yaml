suite: hpa
values:
  - values/app.yaml
templates:
  - templates/hpa.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: scales the component's Deployment on CPU
    set:
      components.api.hpa:
        enabled: true
        maxReplicas: 5
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: autoscaling/v2
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: api
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 5
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 80

  - it: requires maxReplicas
    set:
      components.api.hpa.enabled: true
    asserts:
      - failedTemplate: {}
