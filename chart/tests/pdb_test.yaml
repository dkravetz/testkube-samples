suite: pdb
values:
  - values/app.yaml
templates:
  - templates/pdb.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a PDB per component in prd
    values:
      - values/prd.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/part-of: example
            app.kubernetes.io/component: web
        documentSelector:
          path: metadata.name
          value: web

  - it: takes minAvailable from values
    set:
      components.api.pdb:
        enabled: true
        minAvailable: 50%
    asserts:
      - equal:
          path: spec.minAvailable
          value: 50%
