# An app.yaml for the unit tests (shaped like testkube-samples'), plus the `global` values the
# ApplicationSet would set.
global:
  app: example
  repository: https://github.com/example/example

infrastructure:
  path: infrastructure

components:
  api:
    image:
      repository: ghcr.io/example/example-api
    port: 8080
    healthPath: /hello
    route:
      path: /api # served at /api, stripped before it reaches the container
    database: main # DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD from apps/<app>/<env>/db/main
    tests:
      - name: hurl
        type: hurl
        path: apps/api/tests

  web:
    image:
      repository: ghcr.io/example/example-web
    port: 4173
    healthPath: /
    route:
      path: /
    tests:
      - name: e2e
        type: cypress
        path: apps/web

# Per env, merged over `components`.
envs:
  prd:
    # Testkube tests dev only; prd runs a revision that already passed there.
    tests: false
    components:
      api:
        replicas: 2
        pdb:
          enabled: true
      web:
        replicas: 2
        pdb:
          enabled: true
