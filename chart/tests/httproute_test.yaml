suite: httproute
values:
  - values/app.yaml
templates:
  - templates/httproute.yaml
tests:
  - it: attaches to the shared Gateway with both hostnames
    values:
      - values/prd.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.parentRefs
          value:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: edge
              namespace: envoy-gateway-system
      - equal:
          path: spec.hostnames
          value:
            - example.prd.localhost
            - example.prd.internal

  - it: strips a path prefix with a URLRewrite
    documentSelector:
      path: metadata.name
      value: api
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path
          value:
            type: PathPrefix
            value: /api
      - equal:
          path: spec.rules[0].filters[0]
          value:
            type: URLRewrite
            urlRewrite:
              path:
                type: ReplacePrefixMatch
                replacePrefixMatch: /
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            group: ""
            kind: Service
            name: api
            port: 8080
            weight: 1

  - it: routes / without a filter
    documentSelector:
      path: metadata.name
      value: web
    asserts:
      - notExists:
          path: spec.rules[0].filters

  - it: renders no route for a component without one
    set:
      components.api.route: null
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: web

  - it: rejects a relative path
    set:
      components.api.route.path: api
    asserts:
      - failedTemplate: {}
