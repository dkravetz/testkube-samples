suite: externalsecret
values:
  - values/app.yaml
templates:
  - templates/externalsecret.yaml
tests:
  - it: renders an ExternalSecret only for components with a database
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: api-db

  - it: reads the env's secret through the aws ClusterSecretStore
    values:
      - values/prd.yaml
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: aws
      - equal:
          path: spec.target.name
          value: api-db
      - contains:
          path: spec.data
          content:
            secretKey: DB_PASSWORD
            remoteRef:
              key: apps/example/prd/db/main
              property: password

  - it: maps every key to its DB_* variable
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: DB_HOST
              remoteRef:
                key: apps/example/dev/db/main
                property: host
            - secretKey: DB_NAME
              remoteRef:
                key: apps/example/dev/db/main
                property: dbname
            - secretKey: DB_PASSWORD
              remoteRef:
                key: apps/example/dev/db/main
                property: password
            - secretKey: DB_PORT
              remoteRef:
                key: apps/example/dev/db/main
                property: port
            - secretKey: DB_USER
              remoteRef:
                key: apps/example/dev/db/main
                property: username

  - it: renders nothing without a database
    set:
      components.api.database: null
    asserts:
      - hasDocuments:
          count: 0
