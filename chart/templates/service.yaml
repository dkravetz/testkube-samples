{{- range $name, $c := include "app.components" . | fromYaml }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" $ctx | nindent 4 }}
spec:
  # Always ClusterIP: traffic from outside comes through the shared Gateway (BRIEF D5).
  type: ClusterIP
  selector:
    {{- include "app.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.port }}
      targetPort: http
      protocol: TCP
{{- end }}
