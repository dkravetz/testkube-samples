{{- range $name, $c := include "app.components" . | fromYaml }}
{{- if ($c.hpa).enabled }}
---
# Scales on CPU, which needs metrics-server; the ministack cluster runs without it (BRIEF D5).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $c.hpa.minReplicas | default 1 }}
  maxReplicas: {{ $c.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $c.hpa.cpuUtilization | default 80 }}
{{- end }}
{{- end }}
