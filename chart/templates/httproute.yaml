{{- $g := .Values.global }}
{{- range $name, $c := include "app.components" . | fromYaml }}
{{- with $c.route }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" (dict "root" $ "name" $name) | nindent 4 }}
  annotations:
    # No sync wave: Argo CD counts a route Degraded until its Service exists, so in an earlier
    # wave than the Services it blocks the sync on a fresh cluster.
    # A clickable link in Argo CD (on the app tile and this route): it finds none on HTTPRoutes.
    link.argocd.argoproj.io/external-link: {{ printf "http://%s.%s%s" $g.app $g.domain .path }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: envoy-gateway-system
  hostnames:
    - {{ printf "%s.%s" $g.app $g.domain }} # browsers
    - {{ printf "%s.%s.internal" $g.app $g.env }} # in-cluster tests (BRIEF D21)
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path }}
      {{- if ne .path "/" }}
      filters:
        # The container serves at /, so the prefix is stripped: /api/hello → /hello.
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $name }}
          port: {{ $c.port }}
          weight: 1
{{- end }}
{{- end }}
