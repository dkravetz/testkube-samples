{{- $g := .Values.global }}
{{- range $name, $c := include "app.components" . | fromYaml }}
{{- with $c.route }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" (dict "root" $ "name" $name) | nindent 4 }}
  annotations:
    # Applied before the Deployments (wave -1): on a fresh cluster this kind's CRD or webhook may not
    # be ready yet, and a failed apply in an earlier wave fails the sync, so Argo CD retries it,
    # instead of leaving the sync waiting for pods that can't start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: envoy-gateway-system
  hostnames:
    - {{ printf "%s.%s" $g.app $g.domain }} # browsers
    - {{ printf "%s.%s.internal" $g.app $g.env }} # in-cluster tests (BRIEF D21)
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path }}
      {{- if ne .path "/" }}
      filters:
        # The container serves at /, so the prefix is stripped: /api/hello → /hello.
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $name }}
          port: {{ $c.port }}
          weight: 1
{{- end }}
{{- end }}
