{{- $g := .Values.global }}
{{- range $name, $c := include "app.components" . | fromYaml }}
{{- with $c.database }}
{{- $key := printf "apps/%s/%s/db/%s" $g.app $g.env . }}
---
# The app's own OpenTofu (infrastructure/) writes the secret; this copies it into the namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.dbSecretName" $name }}
  labels:
    {{- include "app.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws
  target:
    name: {{ include "app.dbSecretName" $name }}
    creationPolicy: Owner
  data:
    {{- range $env, $property := dict "DB_HOST" "host" "DB_PORT" "port" "DB_NAME" "dbname" "DB_USER" "username" "DB_PASSWORD" "password" }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ $key }}
        property: {{ $property }}
    {{- end }}
{{- end }}
{{- end }}
