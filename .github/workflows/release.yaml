name: release

# The dev cluster sends `tests-passed` with the commit its Testkube tests just passed against
# (chart/templates/release.yaml). That commit becomes the next release: its images get the version
# tag too, and the release's tag is what prd (envs.prd.revision in app.yaml) follows.
on:
  repository_dispatch:
    types: [tests-passed]

permissions: {}

# One release at a time, so two dispatches never pick the same version.
concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      SHA: ${{ github.event.client_payload.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only commits on main, once each; the next version bumps the latest tag's patch (v0.1.0 first).
      - name: Version
        id: version
        run: |
          git merge-base --is-ancestor "$SHA" origin/main
          if [ -n "$(git tag --points-at "$SHA" --list 'v*')" ]; then
            echo "$SHA is already released: $(git tag --points-at "$SHA" --list 'v*')"
            exit 0
          fi
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            version=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="v$major.$minor.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.version
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The images that ran in dev (build.yaml's sha-<7>), tagged with the version as well.
      - if: steps.version.outputs.version
        name: Tag images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for component in api web; do
            image="ghcr.io/${{ github.repository_owner }}/testkube-samples-$component"
            docker buildx imagetools create --tag "$image:$VERSION" "$image:sha-${SHA::7}"
          done

      - if: steps.version.outputs.version
        name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --target "$SHA" --generate-notes
