# How this app runs on the platform, the one file the team edits. Merged to main = dev; a GitHub
# release = prd. Terrakube reads `infrastructure.path`, and the OpenTofu there reads
# `infrastructure.vars`; Argo CD passes the whole file to the base-app chart (chart/), whose
# values.schema.json lists every field.

infrastructure:
  # OpenTofu for the app's cloud resources, applied by the platform's Terrakube workspaces
  # testkube-samples-dev and testkube-samples-prd.
  path: infrastructure
  # Variables for that OpenTofu, for every env; envs.<env>.infrastructure.vars wins. Unset ones
  # use infrastructure/modules/postgres defaults (db.t4g.micro, 20 GiB). Known keys:
  # db_instance_class, db_allocated_storage.
  vars: {}

components:
  api:
    image:
      repository: ghcr.io/dkravetz/testkube-samples-api
    port: 8080
    healthPath: /hello
    route:
      path: /api # served at /api, stripped before it reaches the container
    database: main # DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD from apps/<app>/<env>/db/main
    tests:
      - name: hurl
        type: hurl
        path: apps/api/tests

  web:
    image:
      repository: ghcr.io/dkravetz/testkube-samples-web
    port: 4173
    healthPath: /
    route:
      path: /
    tests:
      - name: e2e
        type: cypress
        path: apps/web

# The envs this app runs in, each merged over `components`. Argo CD deploys one Application per
# env, at its `revision` (a git ref, default main).
envs:
  dev: {}
  prd:
    # The latest release: dev's tests passing on a commit releases it (.github/workflows/release.yaml).
    revision: ">=0.1.0"
    # Testkube tests dev only; prd runs a revision that already passed there.
    tests: false
    # A bigger database than dev's defaults.
    infrastructure:
      vars:
        db_instance_class: db.t4g.small
        db_allocated_storage: 50
    components:
      api:
        replicas: 2
        pdb:
          enabled: true
      web:
        replicas: 2
        pdb:
          enabled: true
